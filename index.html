<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRIDIUM — High Performance Apparel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --accent: #d4af37;
      --text: #ffffff;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }

    /* HEADER */
    header { position: fixed; top: 0; width: 100%; padding: 2rem; display: flex; justify-content: space-between; z-index: 100; }
    .logo { font-family: 'Cinzel', serif; font-size: 1.5rem; letter-spacing: 4px; }

    /* HERO VIDEO */
    .hero { height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
    .hero-content { position: relative; text-align: center; z-index: 2; animation: fadeIn 2s ease; }
    h1 { font-family: 'Cinzel', serif; font-size: 4rem; letter-spacing: 8px; margin-bottom: 1rem; }

    /* TIENDA HORIZONTAL */
    .store { padding: 4rem 0; }
    .carousel { display: flex; gap: 2rem; overflow-x: auto; padding: 2rem 4rem; scroll-behavior: smooth; }
    .card { flex: 0 0 350px; background: #111; border: 1px solid var(--border); padding: 2rem; border-radius: 20px; transition: 0.4s; }
    .card:hover { border-color: var(--accent); transform: translateY(-10px); }
    .card img { width: 100%; height: 300px; object-fit: cover; border-radius: 10px; filter: grayscale(100%); transition: 0.5s; }
    .card:hover img { filter: grayscale(0%); }
    
    /* BOTÓN LUJO */
    .btn { display: inline-block; margin-top: 1.5rem; padding: 1rem 2rem; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; border-radius: 50px; transition: 0.3s; }
    .btn:hover { background: var(--accent); color: #000; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <div class="logo">IRIDIUM</div>
  </header>

  <section class="hero">
    <video class="video-bg" src="video.mp4" autoplay loop muted playsinline></video>
    <div class="hero-content">
      <h1>IRIDIUM</h1>
      <p>Luxury Streetwear Performance</p>
    </div>
  </section>

  <section class="store">
    <div class="carousel" id="track">
      <!-- Producto 1 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=800" alt="Hoodie">
        <h2>Stealth Hoodie</h2>
        <p>$65.00</p>
        <a href="https://wa.me/593995023674?text=Hola,%20quiero%20el%20Stealth%20Hoodie" class="btn">PEDIR POR WHATSAPP</a>
      </div>
      <!-- Producto 2 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800" alt="Tee">
        <h2>Signature Tee</h2>
        <p>$35.00</p>
        <a href="https://wa.me/593995023674?text=Hola,%20quiero%20la%20Signature%20Tee" class="btn">PEDIR POR WHATSAPP</a>
      </div>
      <!-- Producto 3 -->
      <div class="card">
        <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=800" alt="Zip">
        <h2>Cyber Zip</h2>
        <p>$75.00</p>
        <a href="https://wa.me/593995023674?text=Hola,%20quiero%20el%20Cyber%20Zip" class="btn">PEDIR POR WHATSAPP</a>
      </div>
    </div>
  </section>

  <script>
    // Scroll horizontal suave con mouse
    const track = document.getElementById('track');
    track.addEventListener('wheel', (e) => {
      e.preventDefault();
      track.scrollLeft += e.deltaY;
    });
  </script>
</body>
</html>
