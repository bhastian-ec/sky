<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
>

<meta
    name="theme-color"
    content="#050608"
>

<title>
IRIDIUM — Luxury Streetwear & Apparel
</title>


<!-- =====================================================
     TIPOGRAFÍAS
===================================================== -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
>


<style>

/* =====================================================
   VARIABLES
===================================================== */

:root {

    --bg: #050608;
    --black: #000000;

    --surface: #0b0d11;
    --card: #111319;

    --silver: #e2e8f0;
    --silver-light: #ffffff;
    --silver-dark: #8b929d;

    --text: #f8f9fa;
    --muted: #858b96;

    --border: rgba(255,255,255,.09);
    --border-light: rgba(255,255,255,.25);

    --title: 'Cinzel', serif;
    --body: 'Plus Jakarta Sans', sans-serif;

}


/* =====================================================
   RESET
===================================================== */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html {

    background: var(--bg);

    scroll-behavior: smooth;

}

body {

    background: var(--bg);

    color: var(--text);

    font-family: var(--body);

    overflow-x: hidden;

    -webkit-font-smoothing: antialiased;

}

button,
a {

    font-family: inherit;

}

button {

    border: none;

}

img {

    max-width: 100%;

}


/* =====================================================
   HEADER
===================================================== */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 78px;

    padding: 0 3.5rem;

    display: flex;

    align-items: center;

    justify-content: space-between;

    z-index: 5000;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.85),
            rgba(0,0,0,0)
        );

}


/* LOGO */

.brand {

    display: flex;

    align-items: center;

    gap: 12px;

    color: white;

    text-decoration: none;

    pointer-events: auto;

}

.brand-logo {

    width: 34px;
    height: 34px;

    filter:
        drop-shadow(
            0 0 7px rgba(255,255,255,.4)
        );

}

.brand-name {

    font-family: var(--title);

    font-size: 1.25rem;

    font-weight: 800;

    letter-spacing: 5px;

    background:
        linear-gradient(
            135deg,
            #ffffff 20%,
            #aeb4bf 60%,
            #ffffff 100%
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}


/* =====================================================
   CINTA DE OPCIONES SUPERIOR DERECHA (TOP MENU)
===================================================== */

.top-menu {

    pointer-events: auto;

    display: flex;

    align-items: center;

    gap: 1.8rem;

    padding: 10px 18px;

    border-radius: 50px;

    background: rgba(14,16,20,.72);

    border: 1px solid rgba(255,255,255,.13);

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);

}

.top-menu a {

    color: #9da4af;

    text-decoration: none;

    font-size: .76rem;

    font-weight: 600;

    letter-spacing: 1px;

    transition: .25s;

}

.top-menu a:hover,
.top-menu a.active {

    color: white;

}


/* =====================================================
   APP
===================================================== */

#app {

    min-height: 100vh;

}

.view {

    min-height: 100vh;

    animation:
        pageIn .45s ease;

}

@keyframes pageIn {

    from {

        opacity: 0;

        transform:
            translateY(10px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   HERO
===================================================== */

.hero {

    width: 100%;

    min-height: auto;

    padding:
        76px 0 8px;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        #000;

}

.hero-video-wrapper {

    position: relative;

    width: min(1280px, 100vw);

    aspect-ratio: 16 / 9;

    max-height: 720px;

    overflow: hidden;

    background: #000;

    border-radius: 20px;

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 70px rgba(0,0,0,.9);

}

.hero-video {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

}

.hero-overlay {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.02),
            rgba(0,0,0,.15) 50%,
            rgba(0,0,0,.9) 100%
        );

    pointer-events: none;

}

.hero-content {

    position: absolute;

    left: 50%;

    bottom: 10%;

    transform:
        translateX(-50%);

    width: 90%;

    text-align: center;

}

.hero-symbol {

    width: 52px;
    height: 52px;

    margin-bottom: 12px;

    filter:
        drop-shadow(
            0 0 20px rgba(255,255,255,.5)
        );

}

.hero-title {

    font-family: var(--title);

    font-size:
        clamp(
            2.5rem,
            7vw,
            5rem
        );

    font-weight: 900;

    letter-spacing: 9px;

    background:
        linear-gradient(
            180deg,
            #ffffff 20%,
            #b1b7c0 70%,
            #737984 100%
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}

.hero-subtitle {

    margin-top: 8px;

    color: #e1e5e9;

    font-family: var(--title);

    font-size:
        clamp(
            .7rem,
            1.6vw,
            1rem
        );

    letter-spacing: 4px;

    text-transform: uppercase;

}


/* =====================================================
   EXPLORAR
===================================================== */

.explore {

    padding:
        35px 20px 65px;

    text-align: center;

    background:
        linear-gradient(
            180deg,
            #000000 0%,
            #07090c 50%,
            #000000 100%
        );

}

.explore-label {

    color: #aeb4be;

    font-size: .7rem;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 16px;

}

.explore-title {

    font-family: var(--title);

    font-size:
        clamp(
            2rem,
            5vw,
            3.6rem
        );

    letter-spacing: 5px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #aeb4be,
            #ffffff
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}

.explore-text {

    max-width: 650px;

    margin:
        20px auto 30px;

    color: var(--muted);

    line-height: 1.8;

    font-size: .9rem;

}

.explore-btn {

    display: inline-flex;

    padding:
        15px 35px;

    border-radius: 50px;

    color: #000;

    background: white;

    text-decoration: none;

    font-size: .75rem;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;

    transition: .3s;

}

.explore-btn:hover {

    transform:
        translateY(-3px);

    background:
        #dce1e7;

    box-shadow:
        0 12px 35px
        rgba(255,255,255,.2);

}


/* =====================================================
   CATEGORÍAS
===================================================== */

.categories {

    padding:
        65px 20px 100px;

    background: #050608;

}

.section-heading {

    text-align: center;

    margin-bottom: 42px;

}

.section-heading small {

    color: var(--silver-dark);

    font-size: .7rem;

    letter-spacing: 4px;

    text-transform: uppercase;

}

.section-heading h2 {

    margin-top: 10px;

    font-family: var(--title);

    font-size:
        clamp(
            1.8rem,
            4vw,
            2.8rem
        );

    letter-spacing: 4px;

}

.category-grid {

    max-width: 1300px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px,1fr)
        );

    gap: 20px;

}

.category-card {

    min-height: 210px;

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 20px;

    padding: 25px;

    border-radius: 22px;

    border:
        1px solid var(--border);

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.055),
            rgba(10,11,14,.96)
        );

    color: white;

    cursor: pointer;

    transition:
        transform .35s,
        border-color .35s,
        box-shadow .35s;

}

.category-card:hover {

    transform:
        translateY(-7px);

    border-color:
        rgba(255,255,255,.45);

    box-shadow:
        0 20px 50px rgba(0,0,0,.7),
        0 0 30px
        rgba(255,255,255,.06);

}

.category-logo {

    width: 90px;
    height: 90px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 5px 15px rgba(0,0,0,.7)
        );

}

.category-name {

    font-family: var(--title);

    font-size: .9rem;

    letter-spacing: 2px;

    text-transform: uppercase;

}


/* =====================================================
   HEADER DE PÁGINAS INTERNAS
===================================================== */

.page-header {

    padding:
        125px 5% 45px;

    background:
        linear-gradient(
            180deg,
            #0b0d11,
            #050608
        );

}

.back-btn {

    display: inline-flex;

    align-items: center;

    gap: 10px;

    color: #aeb4be;

    background: none;

    cursor: pointer;

    font-size: .75rem;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    margin-bottom: 30px;

    transition: .25s;

}

.back-btn:hover {

    color: white;

    transform:
        translateX(-4px);

}

.page-header small {

    color:
        var(--silver-dark);

    letter-spacing: 4px;

    font-size: .7rem;

    text-transform: uppercase;

}

.page-header h1 {

    margin-top: 10px;

    font-family: var(--title);

    font-size:
        clamp(
            2rem,
            5vw,
            3.8rem
        );

    letter-spacing: 5px;

    text-transform: uppercase;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #a4abb5
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}


/* =====================================================
   PRODUCTOS
===================================================== */

.products-page {

    padding:
        0 5% 100px;

    background:
        #050608;

}

.products-grid {

    max-width: 1450px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(250px,1fr)
        );

    gap: 24px;

}

.product-card {

    position: relative;

    min-height: 460px;

    overflow: hidden;

    border-radius: 20px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    cursor: pointer;

    transition:
        transform .35s,
        border-color .35s;

}

.product-card:hover {

    transform:
        translateY(-6px);

    border-color:
        rgba(255,255,255,.4);

}

.product-gallery {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #111;

}

.product-gallery-image {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    opacity: 0;

    transition:
        opacity .35s ease,
        transform .5s ease;

}

.product-gallery-image.active {

    opacity: 1;

}

.product-card:hover
.product-gallery-image.active {

    transform:
        scale(1.04);

}

.product-gallery-arrow {

    position: absolute;

    top: 42%;

    transform:
        translateY(-50%);

    width: 38px;

    height: 38px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.65);

    border:
        1px solid
        rgba(255,255,255,.25);

    backdrop-filter: blur(10px);

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    z-index: 20;

    opacity: 0;

    transition:
        opacity .25s,
        background .25s,
        transform .25s;

}

.product-card:hover
.product-gallery-arrow {

    opacity: 1;

}

.product-gallery-arrow:hover {

    background:
        rgba(255,255,255,.95);

    color: #000;

}

.product-gallery-arrow.prev {

    left: 12px;

}

.product-gallery-arrow.next {

    right: 12px;

}

.product-gallery-dots {

    position: absolute;

    left: 50%;

    bottom: 105px;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 6px;

    padding:
        5px 9px;

    background:
        rgba(0,0,0,.55);

    border-radius: 20px;

    z-index: 20;

}

.product-gallery-dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.4);

    cursor: pointer;

    transition: .25s;

}

.product-gallery-dot.active {

    width: 17px;

    border-radius: 10px;

    background: white;

    box-shadow:
        0 0 8px
        rgba(255,255,255,.8);

}

.product-gradient {

    position: absolute;

    inset:
        auto 0 0 0;

    height: 230px;

    background:
        linear-gradient(
            to top,
            #090a0d 10%,
            rgba(9,10,13,.85) 55%,
            transparent
        );

    pointer-events: none;

    z-index: 2;

}

.product-info {

    position: absolute;

    left: 22px;

    right: 22px;

    bottom: 20px;

    z-index: 30;

}

.product-brand {

    color: #aeb4be;

    font-size: .65rem;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;

}

.product-name {

    margin-top: 7px;

    font-family: var(--title);

    font-size: 1.05rem;

    letter-spacing: 1px;

    text-transform: uppercase;

}

.product-price {

    margin-top: 8px;

    font-size: 1.15rem;

    font-weight: 800;

}

.product-view {

    display: inline-flex;

    margin-top: 13px;

    padding:
        9px 17px;

    border-radius: 30px;

    background: white;

    color: black;

    font-size: .65rem;

    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;

}


/* =====================================================
   DETALLE PRODUCTO
===================================================== */

.detail-page {

    padding:
        110px 5% 100px;

    background:
        linear-gradient(
            180deg,
            #0a0c10,
            #050608 30%
        );

}

.detail-container {

    max-width: 1400px;

    margin: auto;

}

.detail-layout {

    display: grid;

    grid-template-columns:
        minmax(0,1.15fr)
        minmax(330px,.85fr);

    gap: 60px;

    align-items: start;

}

.detail-gallery {

    position: relative;

}

.main-product-image {

    width: 100%;

    aspect-ratio:
        1 / 1.15;

    object-fit: contain;

    background:
        #0b0d10;

    border-radius: 20px;

    border:
        1px solid var(--border);

    cursor: default;

}

.thumbnails {

    display: flex;

    gap: 10px;

    overflow-x: auto;

    margin-top: 15px;

    padding-bottom: 5px;

}

.thumbnail {

    flex:
        0 0 80px;

    width: 80px;

    height: 80px;

    object-fit: cover;

    border-radius: 10px;

    border:
        1px solid var(--border);

    cursor: pointer;

    opacity: .5;

    transition: .25s;

}

.thumbnail.active,
.thumbnail:hover {

    opacity: 1;

    border-color:
        rgba(255,255,255,.6);

}

.detail-info {

    padding-top: 15px;

}

.detail-brand {

    color:
        var(--silver-dark);

    font-size: .7rem;

    font-weight: 800;

    letter-spacing: 3px;

    text-transform: uppercase;

}

.detail-title {

    margin-top: 12px;

    font-family: var(--title);

    font-size:
        clamp(
            2rem,
            4vw,
            3.2rem
        );

    line-height: 1.15;

    letter-spacing: 2px;

    text-transform: uppercase;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #a5abb5
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}

.detail-price {

    margin-top: 20px;

    font-size: 1.5rem;

    font-weight: 800;

}

.detail-description {

    margin-top: 25px;

    color: #9298a2;

    line-height: 1.8;

    font-size: .88rem;

}


/* =====================================================
   TALLAS
===================================================== */

.size-title {

    margin-top: 35px;

    font-size: .72rem;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;

}

.sizes {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 15px;

}

.size-btn {

    min-width: 55px;

    padding:
        12px 16px;

    border-radius: 8px;

    border:
        1px solid var(--border);

    background:
        #0d0f13;

    color:
        #dce0e5;

    cursor: pointer;

    font-size: .75rem;

    font-weight: 700;

    transition: .25s;

}

.size-btn:hover,
.size-btn.selected {

    color: #000;

    background: white;

    border-color: white;

}


/* =====================================================
   WHATSAPP
===================================================== */

.order-btn {

    width: 100%;

    margin-top: 30px;

    padding: 17px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 50px;

    background: white;

    color: black;

    text-decoration: none;

    font-size: .75rem;

    font-weight: 900;

    letter-spacing: 2px;

    text-transform: uppercase;

    transition: .3s;

}

.order-btn:hover {

    background:
        #dfe3e8;

    transform:
        translateY(-2px);

}


/* =====================================================
   LOADING / EMPTY
===================================================== */

.loading {

    min-height: 400px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: var(--muted);

    letter-spacing: 2px;

    font-size: .75rem;

}

.empty {

    grid-column:
        1 / -1;

    padding: 80px 20px;

    text-align: center;

    color: var(--muted);

}


/* =====================================================
   FOOTER
===================================================== */

footer {

    padding: 55px 20px;

    text-align: center;

    color: #676d77;

    font-size: .72rem;

    letter-spacing: 1px;

    background: #020304;

    border-top:
        1px solid var(--border);

}


/* =====================================================
   RESPONSIVE (TABLET & MÓVIL)
===================================================== */

@media(max-width:900px) {

    header {

        padding: 0 1.5rem;

        height: 68px;

    }

    .top-menu {

        gap: 12px;

        padding: 8px 14px;

    }

    .top-menu a {

        font-size: .65rem;

    }

    .hero {

        padding:
            76px 0 5px;

    }

    .hero-video-wrapper {

        width: 100%;

        border-radius: 0;

        border-left: 0;

        border-right: 0;

    }

    .hero-content {

        bottom: 8%;

    }

    .hero-title {

        letter-spacing: 5px;

    }

    .detail-layout {

        grid-template-columns: 1fr;

        gap: 35px;

    }

    .detail-info {

        padding: 0 5px;

    }

}

@media(max-width:600px) {

    header {

        padding: 0 15px;

        height: 68px;

    }

    .top-menu {

        gap: 8px;

        padding: 6px 10px;

    }

    .top-menu a {

        font-size: .55rem;

        letter-spacing: .5px;

    }

    .brand-name {

        display: none;

    }

    .brand-logo {

        width: 28px;

        height: 28px;

    }

    .hero-video-wrapper {

        width: 100%;

        aspect-ratio:
            16 / 9;

    }

    .hero-symbol {

        width: 38px;

        height: 38px;

    }

    .hero-title {

        font-size: 2.2rem;

    }

    .hero-subtitle {

        font-size: .58rem;

        letter-spacing: 2px;

    }

    .explore {

        padding:
            28px 18px 50px;

    }

    .categories {

        padding:
            50px 15px 80px;

    }

    .category-grid {

        grid-template-columns:
            repeat(2,1fr);

        gap: 12px;

    }

    .category-card {

        min-height: 165px;

        padding: 15px;

    }

    .category-logo {

        width: 65px;

        height: 65px;

    }

    .category-name {

        font-size: .72rem;

        text-align: center;

    }

    .products-page {

        padding:
            0 12px 80px;

    }

    .products-grid {

        grid-template-columns:
            repeat(2,1fr);

        gap: 12px;

    }

    .product-card {

        min-height: 340px;

    }

    .product-gallery-arrow {

        opacity: 1;

        width: 32px;

        height: 32px;

    }

    .product-gallery-dots {

        bottom: 105px;

    }

    .product-info {

        left: 13px;

        right: 13px;

        bottom: 13px;

    }

    .product-name {

        font-size: .72rem;

    }

    .product-price {

        font-size: .9rem;

    }

    .product-view {

        font-size: .53rem;

        padding:
            7px 10px;

    }

    .page-header {

        padding:
            110px 20px 40px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER (LOGO IZQUIERDO Y CINTA DE OPCIONES DERECHA)
===================================================== -->

<header>

<a

/* =====================================================

const GITHUB_USER = "bhastian-ec";

const GITHUB_REPO = "sky";

const GITHUB_BRANCH = "main";

/* =====================================================

/* =====================================================
   GITHUB API
===================================================== */

async function githubAPI(path) {

    const url =
        `https://api.github.com/repos/` +
        `${GITHUB_USER}/${GITHUB_REPO}/contents/` +
        `${path}?ref=${GITHUB_BRANCH}`;

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            `GitHub API error: ${response.status}`
        );

    }

    return await response.json();

}


/* =====================================================
   LIMPIAR TEXTO
===================================================== */

function cleanText(text) {

    return String(text)

        .replace(/\.[^/.]+$/, "")

        .replace(/_/g, " ")

        .trim();

}


/* =====================================================
   ANALIZAR NOMBRE
===================================================== */

function parseProductFile(filename) {

    const withoutExtension =
        filename.replace(/\.[^/.]+$/, "");

    const parts =
        withoutExtension.split("-");


    let productName =
        cleanText(
            parts[0] || "Producto"
        );


    let price = "0";


    let photoNumber = 1;


    if (parts.length >= 2) {

        price =
            parts[1]
                .replace(",", ".")
                .trim();

    }


    if (parts.length >= 3) {

        const number =
            parseInt(parts[2], 10);

        if (!isNaN(number)) {

            photoNumber = number;

        }

    }


    return {

        productName,

        price,

        photoNumber

    };

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   ESCAPAR ATRIBUTOS
===================================================== */

function escapeAttr(text) {

    return String(text)

        .replace(/\\/g, "\\\\")

        .replace(/'/g, "\\'")

        .replace(/"/g, "&quot;");

}


/* =====================================================
   CREAR ID
===================================================== */

function createId(text) {

    return String(text)

        .toLowerCase()

        .normalize("NFD")

        .replace(/[\u0300-\u036f]/g, "")

        .replace(/[^a-z0-9]+/g, "-")

        .replace(/^-|-$/g, "");

}


/* =====================================================
   LOGO FALLBACK
===================================================== */

function createFallbackLogo(name) {

    const initials =
        String(name)
            .split(/[\s_-]+/)
            .map(word => word.charAt(0))
            .join("")
            .substring(0,3)
            .toUpperCase();


    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="300"
            height="300"
            viewBox="0 0 300 300">

            <rect
                width="300"
                height="300"
                fill="#0b0d11"/>

            <circle
                cx="150"
                cy="150"
                r="105"
                fill="none"
                stroke="#ffffff"
                stroke-width="3"/>

            <text
                x="150"
                y="170"
                text-anchor="middle"
                font-family="Arial"
                font-size="55"
                fill="#ffffff">

                ${initials}

            </text>

        </svg>
    `;


    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);

}


/* =====================================================
   CARGAR CATÁLOGO
===================================================== */

async function loadCatalog() {

    try {

        const folders =
            await githubAPI(
                PRODUCTS_FOLDER
            );


        if (!Array.isArray(folders)) {

            throw new Error(
                "La carpeta products no existe."
            );

        }


        const result = [];


        for (const folder of folders) {

            if (folder.type !== "dir") {

                continue;

            }


            const category =
                folder.name;


            let files = [];


            try {

                files =
                    await githubAPI(
                        `${PRODUCTS_FOLDER}/${encodeURIComponent(category)}`
                    );

            } catch (error) {

                console.error(
                    "Error cargando categoría:",
                    category,
                    error
                );

                continue;

            }


            if (!Array.isArray(files)) {

                continue;

            }


            const possibleLogoNames = [

                `${category}.png`,
                `${category}.jpg`,
                `${category}.jpeg`,
                `${category}.webp`,
                `${category}.svg`

            ];


            const logoFile =
                files.find(file =>

                    possibleLogoNames.some(
                        name =>
                            name.toLowerCase() ===
                            file.name.toLowerCase()
                    )

                );


            let categoryLogo = null;


            if (logoFile) {

                categoryLogo =
                    logoFile.download_url;

            }


            const productsMap = {};


            for (const file of files) {

                if (
                    file.type !== "file"
                ) {

                    continue;

                }


                if (
                    !/\.(jpg|jpeg|png|webp|avif)$/i
                        .test(file.name)
                ) {

                    continue;

                }


                if (
                    logoFile &&
                    file.name.toLowerCase() ===
                    logoFile.name.toLowerCase()
                ) {

                    continue;

                }


                const parsed =
                    parseProductFile(
                        file.name
                    );


                const key =
                    `${category}__` +
                    `${parsed.productName}__` +
                    `${parsed.price}`;


                if (!productsMap[key]) {

                    productsMap[key] = {

                        id:
                            createId(
                                `${category}-${parsed.productName}-${parsed.price}`
                            ),

                        category,

                        name:
                            parsed.productName,

                        price:
                            parsed.price,

                        images: []

                    };

                }


                productsMap[key]
                    .images
                    .push({

                        url:
                            file.download_url,

                        order:
                            parsed.photoNumber

                    });

            }


            const products =
                Object.values(productsMap);


            products.forEach(product => {

                product.images.sort(
                    (a,b) =>
                        a.order - b.order
                );


                product.images =
                    product.images.map(
                        image =>
                            image.url
                    );

            });


            result.push({

                name:
                    category,

                logo:
                    categoryLogo,

                products

            });

        }


        catalog = result;


        router();


    } catch (error) {

        console.error(
            "Error cargando catálogo:",
            error
        );


        document.getElementById(
            "app"
        ).innerHTML = `

            <div class="loading">

                <div>

                    No se pudo cargar el catálogo.

                    <br><br>

                    Revisa que exista:

                    <br><br>

                    <strong>
                        /products
                    </strong>

                    <br><br>

                    y que las categorías
                    estén dentro.

                </div>

            </div>

        `;

    }

}

/* =====================================================
   CAMBIAR FOTO
===================================================== */

function changeProductGallery(
    cardId,
    direction
) {

    const gallery =
        document.getElementById(cardId);


    if (!gallery) return;


    const images =
        gallery.querySelectorAll(
            ".product-gallery-image"
        );


    const dots =
        gallery.querySelectorAll(
            ".product-gallery-dot"
        );


    if (images.length <= 1) {

        return;

    }


    let current =
        Array.from(images)
            .findIndex(
                image =>
                    image.classList.contains(
                        "active"
                    )
            );


    if (current < 0) {

        current = 0;

    }


    images[current]
        .classList
        .remove("active");


    if (dots[current]) {

        dots[current]
            .classList
            .remove("active");

    }


    let next =
        current + direction;


    if (next >= images.length) {

        next = 0;

    }


    if (next < 0) {

        next =
            images.length - 1;

    }


    images[next]
        .classList
        .add("active");


    if (dots[next]) {

        dots[next]
            .classList
            .add("active");

    }

}


/* =====================================================
   SELECCIONAR FOTO
===================================================== */

function setProductGallery(
    cardId,
    index
) {

    const gallery =
        document.getElementById(cardId);


    if (!gallery) return;


    const images =
        gallery.querySelectorAll(
            ".product-gallery-image"
        );


    const dots =
        gallery.querySelectorAll(
            ".product-gallery-dot"
        );


    images.forEach(
        image =>
            image.classList
                .remove("active")
    );


    dots.forEach(
        dot =>
            dot.classList
                .remove("active")
    );


    if (images[index]) {

        images[index]
            .classList
            .add("active");

    }


    if (dots[index]) {

        dots[index]
            .classList
            .add("active");

    }

}

                    .remove("selected")
        );


    button.classList
        .add("selected");


    const orderButton =
        document.getElementById(
            "orderButton"
        );


    if (!orderButton) return;


    const parts =
        getHashParts();


    const categoryName =
        decodeURIComponent(
            parts[1] || ""
        );


    const productId =
        decodeURIComponent(
            parts[2] || ""
        );


    const category =
        catalog.find(
            c =>
                c.name.toLowerCase() ===
                categoryName.toLowerCase()
        );


    if (!category) return;


    const product =
        category.products.find(
            p =>
                p.id === productId
        );


    if (!product) return;


    orderButton.href =
        `https://wa.me/${WHATSAPP}?text=` +
        createWhatsAppMessage(
            product,
            size
        );

}


/* =====================================================
   WHATSAPP
===================================================== */

function createWhatsAppMessage(
    product,
    size = ""
) {

    let message =
        `Hola IRIDIUM, quiero pedir el producto: ` +
        `${product.name} ` +
        `($${product.price})`;


    if (size) {

        message +=
            `, talla ${size}`;

    }


    return encodeURIComponent(
        message
    );

}

/* =====================================================
   HOME
===================================================== */

function navigateHome() {

    window.location.hash = "/";

}


/* =====================================================
   ROUTER
===================================================== */

function router() {

    const parts =
        getHashParts();


    const route =
        parts[0] || "";


    const navLinks = document.querySelectorAll(".top-menu a");
    navLinks.forEach(link => {
        const href = link.getAttribute("href");
        if (
            (route === "" || route === "/") && href === "#/" ||
            route === "colecciones" && href === "#/colecciones" ||
            route === "nosotros" && href === "#/nosotros" ||
            route === "contacto" && href === "#/contacto"
        ) {
            link.classList.add("active");
        } else {
            link.classList.remove("active");
        }
    });


    /* HOME */

    if (
        !route ||
        route === "/"
    ) {

        renderHome();

        return;

    }


    /* COLECCIONES */

    if (
        route === "colecciones"
    ) {

        renderCollections();

        return;

    }


    /* CATEGORÍA */

    if (
        route === "categoria"
    ) {

        const category =
            decodeURIComponent(
                parts[1] || ""
            );


        renderCategory(
            category
        );


        return;

    }


    /* PRODUCTO */

    if (
        route === "producto"
    ) {

        const category =
            decodeURIComponent(
                parts[1] || ""
            );


        const product =
            decodeURIComponent(
                parts[2] || ""
            );


        renderProduct(
            category,
            product
        );


        return;

    }


    /* NOSOTROS */

    if (
        route === "nosotros"
    ) {

        renderAbout();

        return;

    }


    /* CONTACTO */

    if (
        route === "contacto"
    ) {

        renderContact();

        return;

    }


    renderHome();

}


/* =====================================================
   HASH
===================================================== */

function getHashParts() {

    let hash =
        window.location.hash

            .replace(/^#/, "")

            .replace(/^\/+/, "");


    if (!hash) {

        return ["/"];

    }


    return hash
        .split("/")
        .filter(Boolean);

}


/* =====================================================
   CAMBIO DE HASH
===================================================== */

window.addEventListener(
    "hashchange",
    function() {

        router();

        window.scrollTo(
            0,
            0
        );

    }
);
