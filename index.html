<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

const GITHUB_USER = "bhastian-ec";
const GITHUB_REPO = "sky";
const GITHUB_BRANCH = "main";

const GITHUB_API =
  `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}`;

const GITHUB_RAW =
  `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;

let groupedProducts = [];


/* ============================================================
   CONVERTIR NOMBRE DE ARCHIVO EN PRODUCTO
   ============================================================ */

/*

   FORMATO:

   PRODUCTO-PRECIO
   PRODUCTO-PRECIO-FOTO
   PRODUCTO-PRECIO-FOTO-FUTURO

   Ejemplos:

   Lando_Norris-16.jpg

   Producto:
   Lando Norris
   Precio:
   16
   Foto:
   1


   Lando_Norris-16-2.jpg

   Producto:
   Lando Norris
   Precio:
   16
   Foto:
   2


   Lando_Norris-16-3.jpg

   Producto:
   Lando Norris
   Precio:
   16
   Foto:
   3

*/

function parseFileName(fileName) {

    // Quitar extensión
    const nameWithoutExtension =
        fileName.replace(/\.[^/.]+$/, "");

    // Separar por "-"
    const parts =
        nameWithoutExtension.split("-");


    /*
       El último elemento puede ser el número
       de fotografía.

       Ejemplo:

       Lando_Norris-16-2

       parts:

       0 = Lando_Norris
       1 = 16
       2 = 2
    */

    let photoNumber = 1;
    let price;
    let productParts;


    // ¿El último elemento es un número?
    const lastPart =
        parts[parts.length - 1];

    const lastIsNumber =
        /^\d+(\.\d+)?$/.test(lastPart);


    /*
       Si tenemos:

       Producto-16-2

       entonces:

       2 = foto
       16 = precio
    */

    if (
        parts.length >= 3 &&
        lastIsNumber
    ) {

        photoNumber =
            parseInt(lastPart, 10);

        const possiblePrice =
            parts[parts.length - 2];

        if (
            /^\d+(\.\d+)?$/.test(possiblePrice)
        ) {

            price = possiblePrice;

            productParts =
                parts.slice(0, -2);

        } else {

            /*
               Si no existe precio válido
               antes del número de foto,
               tratamos todo como nombre.
            */

            productParts =
                parts.slice(0, -1);

        }

    }

    /*
       Formato:

       Producto-16

       No hay número de foto.
       Por lo tanto es foto 1.
    */

    else if (
        parts.length >= 2 &&
        lastIsNumber
    ) {

        price = lastPart;

        productParts =
            parts.slice(0, -1);

        photoNumber = 1;

    }

    /*
       Si el nombre no tiene precio,
       usamos un precio por defecto.
    */

    else {

        price = "35";

        productParts =
            parts;

        photoNumber = 1;

    }


    /*
       Unir nuevamente el nombre del producto
    */

    let title =
        productParts.join("-");


    /*
       Reemplazar "_" por espacios
    */

    title =
        title.replace(/_/g, " ");


    /*
       Limpiar espacios
    */

    title =
        title.replace(/\s+/g, " ").trim();


    return {

        title: title,

        price: price,

        photoNumber: photoNumber

    };

}


/* ============================================================
   CREAR URL DE IMAGEN
   ============================================================ */

function createImageURL(
    category,
    fileName
) {

    return (
        GITHUB_RAW +
        "/products/" +
        encodeURIComponent(category) +
        "/" +
        encodeURIComponent(fileName)
    );

}


/* ============================================================
   CARGAR CATEGORÍAS Y PRODUCTOS
   ============================================================ */

async function loadGitHubCatalog() {

    const tabsContainer =
        document.getElementById(
            "brandTabsContainer"
        );

    const track =
        document.getElementById(
            "productTrack"
        );


    try {

        /*
           Mensaje mientras carga
        */

        tabsContainer.innerHTML = `
            <div style="
                color:#8a909d;
                padding:20px;
            ">
                Cargando categorías...
            </div>
        `;


        track.innerHTML = `
            <div style="
                color:#8a909d;
                padding:40px;
            ">
                Cargando productos...
            </div>
        `;


        /*
           OBTENER PRODUCTS
        */

        const productsURL =
            `${GITHUB_API}/contents/products?ref=${GITHUB_BRANCH}`;


        const response =
            await fetch(productsURL, {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "No se pudo acceder a la carpeta products"
            );

        }


        const categories =
            await response.json();


        /*
           Limpiar pestañas
        */

        tabsContainer.innerHTML = "";


        /*
           BOTÓN TODOS
        */

        tabsContainer.innerHTML += `

            <a
                href="javascript:void(0)"
                onclick="filterCategory('ALL', this)"
                class="brand-tab active"
            >

                <span class="brand-text">
                    TODOS
                </span>

            </a>

        `;


        /*
           Objeto temporal donde
           agruparemos los productos
        */

        const productsMap = {};


        /* =====================================================
           RECORRER CATEGORÍAS
           ===================================================== */

        for (
            const category of categories
        ) {


            /*
               Ignorar archivos.
               Solo queremos carpetas.
            */

            if (
                category.type !== "dir"
            ) {
                continue;
            }


            /*
               EL NOMBRE DE LA CARPETA
               ES LA CATEGORÍA
            */

            const categoryName =
                category.name;


            /*
               CREAR PESTAÑA AUTOMÁTICAMENTE
            */

            const tab =
                document.createElement("a");


            tab.href =
                "javascript:void(0)";


            tab.className =
                "brand-tab";


            tab.innerHTML = `

                <span class="brand-text">
                    ${categoryName}
                </span>

            `;


            tab.onclick = function () {

                filterCategory(
                    categoryName,
                    this
                );

            };


            tabsContainer.appendChild(tab);


            /*
               OBTENER ARCHIVOS
               DE LA CATEGORÍA
            */

            const categoryURL =
                `${GITHUB_API}/contents/products/${encodeURIComponent(categoryName)}?ref=${GITHUB_BRANCH}`;


            const categoryResponse =
                await fetch(
                    categoryURL,
                    {
                        cache: "no-store"
                    }
                );


            if (
                !categoryResponse.ok
            ) {
                continue;
            }


            const files =
                await categoryResponse.json();


            /*
               RECORRER ARCHIVOS
            */

            for (
                const file of files
            ) {


                /*
                   Solo imágenes
                */

                if (
                    file.type !== "file"
                ) {
                    continue;
                }


                if (
                    !/\.(jpg|jpeg|png|webp|avif|gif)$/i
                    .test(file.name)
                ) {
                    continue;
                }


                /*
                   INTERPRETAR NOMBRE
                */

                const parsed =
                    parseFileName(
                        file.name
                    );


                /*
                   CLAVE ÚNICA DEL PRODUCTO

                   Categoría +
                   Nombre +
                   Precio

                   Esto hace que:

                   Lando_Norris-16.jpg
                   Lando_Norris-16-2.jpg
                   Lando_Norris-16-3.jpg

                   sean UN SOLO PRODUCTO.
                */

                const productKey =
                    categoryName +
                    "__" +
                    parsed.title +
                    "__" +
                    parsed.price;


                /*
                   Crear producto si no existe
                */

                if (
                    !productsMap[productKey]
                ) {

                    productsMap[productKey] = {

                        id:
                            "product_" +
                            Math.random()
                                .toString(36)
                                .substring(2, 10),

                        brand:
                            categoryName,

                        title:
                            parsed.title,

                        price:
                            parsed.price,

                        images: []

                    };

                }


                /*
                   AGREGAR FOTO
                */

                productsMap[
                    productKey
                ].images.push({

                    url:
                        createImageURL(
                            categoryName,
                            file.name
                        ),

                    order:
                        parsed.photoNumber,

                    fileName:
                        file.name

                });

            }

        }


        /*
           CONVERTIR MAPA EN ARRAY
        */

        groupedProducts =
            Object.values(
                productsMap
            );


        /*
           ORDENAR FOTOS
        */

        groupedProducts.forEach(
            product => {

                product.images.sort(
                    (a, b) =>
                        a.order - b.order
                );

            }
        );


        /*
           Mostrar productos
        */

        renderProducts("ALL");


        console.log(
            "Categorías:",
            categories
        );


        console.log(
            "Productos:",
            groupedProducts
        );


    }

    catch (error) {

        console.error(
            "Error:",
            error
        );


        tabsContainer.innerHTML = `

            <div style="
                color:#ff6b6b;
                padding:20px;
            ">

                Error cargando categorías.

            </div>

        `;


        track.innerHTML = `

            <div style="
                color:#ff6b6b;
                padding:40px;
            ">

                No se pudieron cargar
                los productos desde GitHub.

            </div>

        `;

    }

}


/* ============================================================
   MOSTRAR PRODUCTOS
   ============================================================ */

function renderProducts(
    filterBrand
) {

    const track =
        document.getElementById(
            "productTrack"
        );


    track.innerHTML = "";


    /*
       FILTRAR POR CATEGORÍA
    */

    const filteredProducts =
        filterBrand === "ALL"

        ? groupedProducts

        : groupedProducts.filter(
            product =>
                product.brand.toUpperCase()
                === filterBrand.toUpperCase()
        );


    /*
       Si no hay productos
    */

    if (
        filteredProducts.length === 0
    ) {

        track.innerHTML = `

            <p style="
                padding:2rem;
                color:var(--text-muted);
            ">

                No hay productos
                en esta división.

            </p>

        `;

        return;

    }


    /*
       Duplicar productos
       para el marquee
    */

    const productsToShow =
        filteredProducts.length < 5

        ? [
            ...filteredProducts,
            ...filteredProducts,
            ...filteredProducts
        ]

        : filteredProducts;


    /*
       CREAR TARJETAS
    */

    productsToShow.forEach(
        (product, productIndex) => {


            const cardId =
                product.id +
                "_" +
                productIndex;


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "product-card";


            card.id =
                cardId;


            /*
               GALERÍA
            */

            let imagesHTML = `

                <div
                    class="card-gallery-wrapper"
                >

            `;


            product.images.forEach(
                (image, imageIndex) => {

                    imagesHTML += `

                        <img

                            src="${image.url}"

                            alt="${product.title}"

                            class="
                                card-img-slide
                                ${imageIndex === 0
                                    ? "active"
                                    : ""}
                            "

                            data-index="${imageIndex}"

                            loading="lazy"

                            onclick="
                                openModal(
                                    '${image.url}'
                                )
                            "

                        />

                    `;

                }
            );


            imagesHTML += `
                </div>
            `;


            /*
               CONTROLES
            */

            let controlsHTML = "";


            if (
                product.images.length > 1
            ) {

                controlsHTML = `

                    <button

                        class="
                            gallery-arrow
                            prev
                        "

                        onclick="
                            changeSlide(
                                '${cardId}',
                                -1,
                                event
                            )
                        "

                    >
                        &#10094;

                    </button>


                    <button

                        class="
                            gallery-arrow
                            next
                        "

                        onclick="
                            changeSlide(
                                '${cardId}',
                                1,
                                event
                            )
                        "

                    >
                        &#10095;

                    </button>


                    <div
                        class="gallery-dots"
                    >

                        ${product.images
                            .map(
                                (_, index) => `

                                    <span

                                        class="
                                            gallery-dot
                                            ${index === 0
                                                ? "active"
                                                : ""}
                                        "

                                        onclick="
                                            setSlide(
                                                '${cardId}',
                                                ${index},
                                                event
                                            )
                                        "

                                    ></span>

                                `
                            )
                            .join("")}

                    </div>

                `;

            }


            /*
               WHATSAPP
            */

            const message =
                `Hola IRIDIUM, quiero el producto: ${product.title} ($${product.price})`;


            /*
               TARJETA COMPLETA
            */

            card.innerHTML = `

                ${imagesHTML}

                ${controlsHTML}


                <div
                    class="card-overlay"
                ></div>


                <div
                    class="card-info"
                >

                    <span
                        class="card-tag"
                    >

                        // ${product.brand}

                    </span>


                    <h3
                        class="card-title"
                    >

                        ${product.title}

                    </h3>


                    <div
                        class="card-bottom"
                    >

                        <span
                            class="card-price"
                        >

                            $${product.price}

                        </span>


                        <a

                            href="
                                https://wa.me/593995023674?text=${encodeURIComponent(message)}
                            "

                            target="_blank"

                            class="btn-card-wa"

                        >

                            Pedir

                        </a>

                    </div>

                </div>

            `;


            track.appendChild(
                card
            );

        }
    );

}


/* ============================================================
   CAMBIAR FOTO
   ============================================================ */

function changeSlide(
    cardId,
    step,
    event
) {

    if (event) {
        event.stopPropagation();
    }


    const card =
        document.getElementById(
            cardId
        );


    if (!card) {
        return;
    }


    const slides =
        card.querySelectorAll(
            ".card-img-slide"
        );


    const dots =
        card.querySelectorAll(
            ".gallery-dot"
        );


    let current =
        Array.from(slides)
            .findIndex(
                slide =>
                    slide.classList
                        .contains("active")
            );


    if (current < 0) {
        current = 0;
    }


    slides[current]
        .classList
        .remove("active");


    if (dots[current]) {

        dots[current]
            .classList
            .remove("active");

    }


    let next =
        current + step;


    if (
        next >= slides.length
    ) {
        next = 0;
    }


    if (next < 0) {
        next =
            slides.length - 1;
    }


    slides[next]
        .classList
        .add("active");


    if (dots[next]) {

        dots[next]
            .classList
            .add("active");

    }

}


/* ============================================================
   SELECCIONAR FOTO
   ============================================================ */

function setSlide(
    cardId,
    index,
    event
) {

    if (event) {
        event.stopPropagation();
    }


    const card =
        document.getElementById(
            cardId
        );


    if (!card) {
        return;
    }


    const slides =
        card.querySelectorAll(
            ".card-img-slide"
        );


    const dots =
        card.querySelectorAll(
            ".gallery-dot"
        );


    slides.forEach(
        slide =>
            slide.classList
                .remove("active")
    );


    dots.forEach(
        dot =>
            dot.classList
                .remove("active")
    );


    if (slides[index]) {

        slides[index]
            .classList
            .add("active");

    }


    if (dots[index]) {

        dots[index]
            .classList
            .add("active");

    }

}


/* ============================================================
   MODAL
   ============================================================ */

function openModal(
    src
) {

    const modal =
        document.getElementById(
            "imageModal"
        );


    const modalImg =
        document.getElementById(
            "modalImg"
        );


    modalImg.src =
        src;


    modal.classList.add(
        "active"
    );

}


function closeModal() {

    const modal =
        document.getElementById(
            "imageModal"
        );


    modal.classList.remove(
        "active"
    );

}


/* ============================================================
   FILTRAR CATEGORÍA
   ============================================================ */

function filterCategory(
    brand,
    element
) {

    const tabs =
        document.querySelectorAll(
            ".brand-tab"
        );


    const title =
        document.getElementById(
            "galleryTitle"
        );


    /*
       Quitar active
    */

    tabs.forEach(
        tab =>
            tab.classList
                .remove("active")
    );


    /*
       Activar pestaña
    */

    if (element) {

        element.classList.add(
            "active"
        );

    }


    /*
       Cambiar título
    */

    title.innerText =
        brand === "ALL"

        ? "Últimos Lanzamientos"

        : `Colección // ${brand}`;


    /*
       Mostrar productos
    */

    renderProducts(
        brand
    );


    /*
       Scroll
    */

    document
        .getElementById(
            "lanzamientos"
        )
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* ============================================================
   ESC PARA CERRAR MODAL
   ============================================================ */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeModal();

        }

    }
);


/* ============================================================
   INICIAR
   ============================================================ */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        loadGitHubCatalog();

    }
);
</script>
