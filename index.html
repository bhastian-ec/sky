/* =========================================================

* {

========================================================= */

.releases-section {

========================================================= */

.gallery-arrow {

<script>

/* =========================================================
   CONFIGURACIÓN GITHUB
========================================================= */

const GITHUB_USER =
  "bhastian-ec";

const GITHUB_REPO =
  "sky";

const GITHUB_BRANCH =
  "main";


const GITHUB_API =
  `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}`;


const GITHUB_RAW =
  `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;


let groupedProducts = [];


/* =========================================================
   INTERPRETAR NOMBRE DE ARCHIVO

   Producto-Precio.jpg
   Producto-Precio-2.jpg
   Producto-Precio-3.jpg
========================================================= */

function parseFileName(fileName) {

  const cleanName =
    fileName.replace(
      /\.[^/.]+$/,
      ""
    );


  const parts =
    cleanName.split("-");


  let title = "";

  let price = "35";

  let photoNumber = 1;


  /*
     Producto-20-2

     Producto = parts 0
     20       = parts 1
     2        = parts 2
  */

  if (
    parts.length >= 3 &&
    /^\d+(\.\d+)?$/.test(
      parts[parts.length - 2]
    ) &&
    /^\d+$/.test(
      parts[parts.length - 1]
    )
  ) {

    price =
      parts[parts.length - 2];


    photoNumber =
      parseInt(
        parts[parts.length - 1],
        10
      );


    title =
      parts
        .slice(0, -2)
        .join("-");

  }


  /*
     Producto-20

     Es la primera foto.
  */

  else if (
    parts.length >= 2 &&
    /^\d+(\.\d+)?$/.test(
      parts[parts.length - 1]
    )
  ) {

    price =
      parts[parts.length - 1];


    photoNumber = 1;


    title =
      parts
        .slice(0, -1)
        .join("-");

  }


  /*
     Sin precio.
  */

  else {

    title =
      cleanName;

    price =
      "35";

    photoNumber =
      1;

  }


  /*
     Convertir:

     Lando_Norris

     en:

     Lando Norris
  */

  title =
    title
      .replace(/_/g, " ")
      .replace(/\s+/g, " ")
      .trim();


  return {

    title,

    price,

    photoNumber

  };

}


/* =========================================================
   URL RAW DE GITHUB
========================================================= */

function createImageURL(
  category,
  fileName
) {

  return (
    GITHUB_RAW +
    "/products/" +
    encodeURIComponent(category) +
    "/" +
    encodeURIComponent(fileName)
  );

}


/* =========================================================
   CARGAR CATEGORÍAS
========================================================= */

async function loadGitHubCatalog() {

  const tabs =
    document.getElementById(
      "brandTabsContainer"
    );


  const track =
    document.getElementById(
      "productTrack"
    );


  try {

    tabs.innerHTML = `
      <div
        style="
          padding:20px;
          color:#8a909d;
        "
      >
        Cargando categorías...
      </div>
    `;


    /*
       Obtener /products
    */

    const response =
      await fetch(
        `${GITHUB_API}/contents/products?ref=${GITHUB_BRANCH}`,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `GitHub API: ${response.status}`
      );

    }


    const categories =
      await response.json();


    /*
       Limpiar
    */

    tabs.innerHTML = "";


    /*
       BOTÓN TODOS
    */

    const allTab =
      document.createElement(
        "a"
      );


    allTab.href =
      "javascript:void(0)";


    allTab.className =
      "brand-tab active";


    allTab.innerHTML = `
      <span class="brand-text">
        TODOS
      </span>
    `;


    allTab.onclick =
      function() {

        filterCategory(
          "ALL",
          this
        );

      };


    tabs.appendChild(
      allTab
    );


    /*
       Mapa de productos
    */

    const productMap = {};


    /*
       RECORRER CARPETAS
    */

    for (
      const category of categories
    ) {

      /*
         Solo carpetas
      */

      if (
        category.type !== "dir"
      ) {

        continue;

      }


      /*
         NOMBRE DE LA CARPETA
         = CATEGORÍA
      */

      const categoryName =
        category.name;


      /*
         CREAR PESTAÑA
      */

      const categoryTab =
        document.createElement(
          "a"
        );


      categoryTab.href =
        "javascript:void(0)";


      categoryTab.className =
        "brand-tab";


      categoryTab.innerHTML = `
        <span class="brand-text">
          ${categoryName}
        </span>
      `;


      categoryTab.onclick =
        function() {

          filterCategory(
            categoryName,
            this
          );

        };


      tabs.appendChild(
        categoryTab
      );


      /*
         OBTENER ARCHIVOS
         DE LA CATEGORÍA
      */

      const folderResponse =
        await fetch(
          `${GITHUB_API}/contents/products/${encodeURIComponent(categoryName)}?ref=${GITHUB_BRANCH}`,
          {
            cache: "no-store"
          }
        );


      if (
        !folderResponse.ok
      ) {

        console.warn(
          "No se pudo cargar:",
          categoryName
        );

        continue;

      }


      const files =
        await folderResponse.json();


      /*
         RECORRER IMÁGENES
      */

      for (
        const file of files
      ) {

        /*
           Solo archivos
        */

        if (
          file.type !== "file"
        ) {

          continue;

        }


        /*
           Solo imágenes
        */

        if (
          !/\.(jpg|jpeg|png|webp|avif|gif)$/i
            .test(file.name)
        ) {

          continue;

        }


        /*
           INTERPRETAR NOMBRE
        */

        const data =
          parseFileName(
            file.name
          );


        /*
           CLAVE DEL PRODUCTO

           La misma clave agrupa:

           Lando_Norris-16.jpg
           Lando_Norris-16-2.jpg
           Lando_Norris-16-3.jpg
        */

        const productKey =
          categoryName +
          "||" +
          data.title +
          "||" +
          data.price;


        /*
           CREAR PRODUCTO
        */

        if (
          !productMap[productKey]
        ) {

          productMap[productKey] = {

            id:
              "product_" +
              Math.random()
                .toString(36)
                .substring(2, 10),

            brand:
              categoryName,

            title:
              data.title,

            price:
              data.price,

            images: []

          };

        }


        /*
           AGREGAR FOTO
        */

        productMap[
          productKey
        ].images.push({

          url:
            createImageURL(
              categoryName,
              file.name
            ),

          order:
            data.photoNumber

        });

      }

    }


    /*
       CONVERTIR A ARRAY
    */

    groupedProducts =
      Object.values(
        productMap
      );


    /*
       ORDENAR FOTOS
    */

    groupedProducts.forEach(
      product => {

        product.images.sort(
          (a,b) =>
            a.order - b.order
        );

      }
    );


    /*
       MOSTRAR
    */

    renderProducts(
      "ALL"
    );


    console.log(
      "CATÁLOGO IRIDIUM:",
      groupedProducts
    );


  }

  catch(error) {

    console.error(
      "Error cargando catálogo:",
      error
    );


    tabs.innerHTML = `
      <div
        style="
          color:#ff6b6b;
          padding:20px;
        "
      >
        Error cargando categorías.
      </div>
    `;


    track.innerHTML = `
      <div
        style="
          color:#ff6b6b;
          padding:40px;
        "
      >

        No se pudieron cargar
        los productos desde GitHub.

        <br><br>

        <small>
          Abre la consola del navegador
          para ver el error.
        </small>

      </div>
    `;

  }

}


/* =========================================================
   RENDERIZAR PRODUCTOS
========================================================= */

function renderProducts(
  filterBrand
) {

  const track =
    document.getElementById(
      "productTrack"
    );


  track.innerHTML =
    "";


  /*
     FILTRAR
  */

  const filtered =
    filterBrand === "ALL"

    ? groupedProducts

    : groupedProducts.filter(
        product =>
          product.brand.toUpperCase()
          === filterBrand.toUpperCase()
      );


  /*
     SIN PRODUCTOS
  */

  if (
    filtered.length === 0
  ) {

    track.innerHTML = `
      <p
        style="
          padding:2rem;
          color:var(--text-muted);
        "
      >
        No hay productos
        en esta división.
      </p>
    `;

    return;

  }


  /*
     DUPLICAR SI SON POCOS
  */

  const productsToRender =
    filtered.length < 5

    ? [
        ...filtered,
        ...filtered,
        ...filtered
      ]

    : filtered;


  /*
     CREAR TARJETAS
  */

  productsToRender.forEach(
    (product,index) => {

      const cardId =
        `${product.id}_${index}`;


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "product-card";


      card.id =
        cardId;


      /*
         IMÁGENES
      */

      let imagesHTML = `
        <div
          class="card-gallery-wrapper"
        >
      `;


      product.images.forEach(
        (image,imageIndex) => {

          imagesHTML += `

            <img

              src="${image.url}"

              alt="${product.title}"

              class="
                card-img-slide
                ${imageIndex === 0
                  ? "active"
                  : ""}
              "

              data-index="${imageIndex}"

              loading="lazy"

              onclick="
                openModal(
                  '${image.url}'
                )
              "

            >

          `;

        }
      );


      imagesHTML += `
        </div>
      `;


      /*
         CONTROLES
      */

      let controlsHTML =
        "";


      if (
        product.images.length > 1
      ) {

        controlsHTML = `

          <button

            class="
              gallery-arrow
              prev
            "

            onclick="
              changeSlide(
                '${cardId}',
                -1,
                event
              )
            "

          >
            &#10094;

          </button>


          <button

            class="
              gallery-arrow
              next
            "

            onclick="
              changeSlide(
                '${cardId}',
                1,
                event
              )
            "

          >
            &#10095;

          </button>


          <div
            class="gallery-dots"
          >

            ${product.images
              .map(
                (_,i) => `

                  <span

                    class="
                      gallery-dot
                      ${i === 0
                        ? "active"
                        : ""}
                    "

                    onclick="
                      setSlide(
                        '${cardId}',
                        ${i},
                        event
                      )
                    "

                  ></span>

                `
              )
              .join("")
            }

          </div>

        `;

      }


      /*
         WHATSAPP
      */

      const message =
        `Hola IRIDIUM, quiero el producto: ${product.title} ($${product.price})`;


      /*
         TARJETA
      */

      card.innerHTML = `

        ${imagesHTML}

        ${controlsHTML}


        <div
          class="card-overlay"
        ></div>


        <div
          class="card-info"
        >

          <span
            class="card-tag"
          >

            // ${product.brand}

          </span>


          <h3
            class="card-title"
          >

            ${product.title}

          </h3>


          <div
            class="card-bottom"
          >

            <span
              class="card-price"
            >

              $${product.price}

            </span>


            <a

              href="
                https://wa.me/593995023674?text=${encodeURIComponent(message)}
              "

              target="_blank"

              rel="noopener noreferrer"

              class="btn-card-wa"

            >

              Pedir

            </a>

          </div>

        </div>

      `;


      track.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   CAMBIAR FOTO
========================================================= */

function changeSlide(
  cardId,
  step,
  event
) {

  if (event) {

    event.stopPropagation();

  }


  const card =
    document.getElementById(
      cardId
    );


  if (!card) {

    return;

  }


  const slides =
    card.querySelectorAll(
      ".card-img-slide"
    );


  const dots =
    card.querySelectorAll(
      ".gallery-dot"
    );


  if (
    slides.length === 0
  ) {

    return;

  }


  let current =
    Array.from(slides)
      .findIndex(
        slide =>
          slide.classList
            .contains("active")
      );


  if (
    current < 0
  ) {

    current = 0;

  }


  slides[current]
    .classList
    .remove("active");


  if (
    dots[current]
  ) {

    dots[current]
      .classList
      .remove("active");

  }


  let next =
    current + step;


  if (
    next >= slides.length
  ) {

    next = 0;

  }


  if (
    next < 0
  ) {

    next =
      slides.length - 1;

  }


  slides[next]
    .classList
    .add("active");


  if (
    dots[next]
  ) {

    dots[next]
      .classList
      .add("active");

  }

}


/* =========================================================
   SELECCIONAR FOTO
========================================================= */

function setSlide(
  cardId,
  index,
  event
) {

  if (event) {

    event.stopPropagation();

  }


  const card =
    document.getElementById(
      cardId
    );


  if (!card) {

    return;

  }


  const slides =
    card.querySelectorAll(
      ".card-img-slide"
    );


  const dots =
    card.querySelectorAll(
      ".gallery-dot"
    );


  slides.forEach(
    slide =>
      slide.classList
        .remove("active")
  );


  dots.forEach(
    dot =>
      dot.classList
        .remove("active")
  );


  if (
    slides[index]
  ) {

    slides[index]
      .classList
      .add("active");

  }


  if (
    dots[index]
  ) {

    dots[index]
      .classList
      .add("active");

  }

}


/* =========================================================
   MODAL
========================================================= */

function openModal(
  src
) {

  const modal =
    document.getElementById(
      "imageModal"
    );


  const modalImg =
    document.getElementById(
      "modalImg"
    );


  modalImg.src =
    src;


  modal.classList.add(
    "active"
  );

}


function closeModal() {

  const modal =
    document.getElementById(
      "imageModal"
    );


  modal.classList.remove(
    "active"
  );

}


/* =========================================================
   FILTRAR CATEGORÍA
========================================================= */

function filterCategory(
  brand,
  element
) {

  const tabs =
    document.querySelectorAll(
      ".brand-tab"
    );


  const title =
    document.getElementById(
      "galleryTitle"
    );


  tabs.forEach(
    tab =>
      tab.classList
        .remove("active")
  );


  if (
    element
  ) {

    element.classList.add(
      "active"
    );

  }


  title.innerText =
    brand === "ALL"

    ? "Últimos Lanzamientos"

    : `Colección // ${brand}`;


  renderProducts(
    brand
  );


  document
    .getElementById(
      "lanzamientos"
    )
    .scrollIntoView({
      behavior:
        "smooth"
    });

}


/* =========================================================
   CERRAR MODAL CON ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeModal();

    }

  }
);


/* =========================================================
   INICIAR
========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  function() {

    loadGitHubCatalog();

  }
);

</script>
