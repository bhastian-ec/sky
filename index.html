<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<meta name="theme-color" content="#050608">

<title>IRIDIUM — Luxury Streetwear & Apparel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

:root {
    --bg: #050608;
    --black: #000000;
    --surface: #0c0e12;
    --card: #111319;

    --silver: #e2e8f0;
    --silver-light: #ffffff;
    --silver-dark: #8d949f;

    --text: #f8f9fa;
    --muted: #8a909d;

    --border: rgba(255,255,255,.09);
    --border-light: rgba(255,255,255,.22);

    --title: 'Cinzel', serif;
    --body: 'Plus Jakarta Sans', sans-serif;
}

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
    background: var(--bg);
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

button,
a {
    font-family: inherit;
}

button {
    border: 0;
}

img {
    max-width: 100%;
}

.hidden {
    display: none !important;
}


/* =========================
   HEADER
========================= */

header {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 4%;

    z-index: 1000;

    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.75),
        rgba(0,0,0,0)
    );

    pointer-events: none;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;

    color: white;
    text-decoration: none;

    pointer-events: auto;
}

.brand-logo {
    width: 34px;
    height: 34px;

    filter:
        drop-shadow(0 0 6px rgba(255,255,255,.45));
}

.brand-name {
    font-family: var(--title);
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 5px;

    background:
        linear-gradient(
            135deg,
            #ffffff 15%,
            #b8bec8 55%,
            #ffffff 100%
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


/* =========================
   NAV
========================= */

.main-nav {
    pointer-events: auto;

    display: flex;
    align-items: center;
    gap: 30px;

    padding: 9px 20px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 40px;

    background: rgba(10,11,14,.72);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.main-nav a {
    color: #aeb4be;
    text-decoration: none;

    font-size: .74rem;
    font-weight: 700;

    letter-spacing: 1px;
    text-transform: uppercase;

    transition: .25s;
}

.main-nav a:hover,
.main-nav a.active {
    color: white;
}

.header-actions {
    pointer-events: auto;
}

.header-wa {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: white;

    text-decoration: none;

    border: 1px solid rgba(255,255,255,.14);

    background: rgba(10,11,14,.7);

    backdrop-filter: blur(15px);

    transition: .3s;
}

.header-wa:hover {
    transform: scale(1.06);
    border-color: rgba(255,255,255,.5);
}


/* =========================
   VIEWS
========================= */

#app {
    min-height: 100vh;
}

.view {
    min-height: 100vh;
    animation: pageIn .5s ease;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   HERO
========================= */

.hero {
    width: 100%;
    min-height: 100vh;

    padding:
        76px 20px 60px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #101217 0%,
            #050608 55%,
            #000 100%
        );
}

.hero-video-wrapper {
    position: relative;

    width: min(1280px, 100%);

    /*
       Mantiene SIEMPRE 16:9.
       El video jamás se estira.
    */
    aspect-ratio: 16 / 9;

    max-height: 720px;

    overflow: hidden;

    border-radius: 22px;

    border: 1px solid rgba(255,255,255,.1);

    background: #000;

    box-shadow:
        0 30px 80px rgba(0,0,0,.9);
}

.hero-video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    /*
       contain = jamás distorsiona.
       El video mantiene exactamente su proporción.
    */
    object-fit: contain;

    background: #000;
}

.hero-overlay {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(0,0,0,.15) 45%,
            rgba(0,0,0,.9) 100%
        );

    pointer-events: none;
}

.hero-content {
    position: absolute;

    left: 50%;
    bottom: 10%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;
}

.hero-symbol {
    width: 52px;
    height: 52px;

    margin-bottom: 15px;

    filter:
        drop-shadow(0 0 20px rgba(255,255,255,.5));
}

.hero-title {
    font-family: var(--title);

    font-size: clamp(
        2.5rem,
        7vw,
        5rem
    );

    font-weight: 900;

    letter-spacing: 9px;

    background:
        linear-gradient(
            180deg,
            #ffffff 25%,
            #aeb4be 70%,
            #737984 100%
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero-subtitle {
    margin-top: 8px;

    color: #dfe3e8;

    font-family: var(--title);

    letter-spacing: 4px;

    font-size: clamp(
        .7rem,
        1.6vw,
        1rem
    );

    text-transform: uppercase;
}


/* =========================
   EXPLORE SECTION
========================= */

.explore {
    padding: 100px 20px 90px;

    text-align: center;

    background:
        linear-gradient(
            180deg,
            #000000 0%,
            #07090c 50%,
            #000000 100%
        );
}

.explore-label {
    color: #aeb4be;

    font-size: .72rem;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 18px;
}

.explore-title {
    font-family: var(--title);

    font-size: clamp(
        2rem,
        5vw,
        3.6rem
    );

    letter-spacing: 5px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #aeb4be,
            #ffffff
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.explore-text {
    max-width: 650px;

    margin: 20px auto 35px;

    color: var(--muted);

    line-height: 1.8;

    font-size: .9rem;
}

.explore-btn {
    display: inline-flex;

    padding: 15px 35px;

    border-radius: 50px;

    color: #000;

    background: #fff;

    text-decoration: none;

    font-size: .75rem;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;

    transition: .3s;
}

.explore-btn:hover {
    transform: translateY(-3px);

    background: #dce1e7;

    box-shadow:
        0 12px 35px rgba(255,255,255,.2);
}


/* =========================
   CATEGORIES
========================= */

.categories {
    padding: 80px 20px 110px;

    background: #050608;
}

.section-heading {
    text-align: center;

    margin-bottom: 45px;
}

.section-heading small {
    color: var(--silver-dark);

    font-size: .7rem;

    letter-spacing: 4px;

    text-transform: uppercase;
}

.section-heading h2 {
    margin-top: 10px;

    font-family: var(--title);

    font-size: clamp(
        1.8rem,
        4vw,
        2.8rem
    );

    letter-spacing: 4px;
}

.category-grid {
    max-width: 1300px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 20px;
}

.category-card {
    min-height: 210px;

    position: relative;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 20px;

    padding: 25px;

    border-radius: 22px;

    border: 1px solid var(--border);

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.055),
            rgba(10,11,14,.95)
        );

    color: white;

    cursor: pointer;

    transition:
        transform .35s,
        border-color .35s,
        box-shadow .35s;
}

.category-card:hover {
    transform: translateY(-7px);

    border-color:
        rgba(255,255,255,.45);

    box-shadow:
        0 20px 50px rgba(0,0,0,.7),
        0 0 30px rgba(255,255,255,.06);
}

.category-logo {
    width: 90px;
    height: 90px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 5px 15px rgba(0,0,0,.6)
        );
}

.category-name {
    font-family: var(--title);

    font-size: .9rem;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* =========================
   INNER PAGE HEADER
========================= */

.page-header {
    padding:
        130px 5% 50px;

    background:
        linear-gradient(
            180deg,
            #0b0d11,
            #050608
        );
}

.back-btn {
    display: inline-flex;

    align-items: center;

    gap: 10px;

    color: #aeb4be;

    background: none;

    cursor: pointer;

    font-size: .75rem;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    margin-bottom: 35px;

    transition: .25s;
}

.back-btn:hover {
    color: white;

    transform: translateX(-4px);
}

.page-header small {
    color: var(--silver-dark);

    letter-spacing: 4px;

    font-size: .7rem;

    text-transform: uppercase;
}

.page-header h1 {
    margin-top: 10px;

    font-family: var(--title);

    font-size: clamp(
        2rem,
        5vw,
        3.8rem
    );

    letter-spacing: 5px;

    text-transform: uppercase;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #a4abb5
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


/* =========================
   PRODUCTS GRID
========================= */

.products-page {
    padding:
        0 5% 100px;

    background: #050608;
}

.products-grid {
    max-width: 1450px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(250px, 1fr)
        );

    gap: 24px;
}

.product-card {
    position: relative;

    min-height: 460px;

    overflow: hidden;

    border-radius: 20px;

    border: 1px solid var(--border);

    background: var(--card);

    cursor: pointer;

    transition:
        transform .35s,
        border-color .35s;
}

.product-card:hover {
    transform: translateY(-6px);

    border-color:
        rgba(255,255,255,.4);
}

.product-image {
    width: 100%;
    height: 350px;

    display: block;

    object-fit: cover;

    background: #111;

    transition: transform .5s;
}

.product-card:hover .product-image {
    transform: scale(1.04);
}

.product-gradient {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 210px;

    background:
        linear-gradient(
            to top,
            #090a0d 15%,
            rgba(9,10,13,.85) 55%,
            transparent
        );

    pointer-events: none;
}

.product-info {
    position: absolute;

    left: 22px;
    right: 22px;
    bottom: 20px;

    z-index: 2;
}

.product-brand {
    color: #aeb4be;

    font-size: .65rem;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.product-name {
    margin-top: 7px;

    font-family: var(--title);

    font-size: 1.05rem;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.product-price {
    margin-top: 8px;

    font-size: 1.15rem;

    font-weight: 800;
}

.product-view {
    display: inline-flex;

    margin-top: 13px;

    padding: 9px 17px;

    border-radius: 30px;

    background: white;

    color: black;

    font-size: .65rem;

    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;
}


/* =========================
   PRODUCT DETAIL
========================= */

.detail-page {
    padding:
        110px 5% 100px;

    background:
        linear-gradient(
            180deg,
            #0a0c10,
            #050608 30%
        );
}

.detail-container {
    max-width: 1400px;

    margin: auto;
}

.detail-layout {
    display: grid;

    grid-template-columns:
        minmax(0, 1.15fr)
        minmax(330px, .85fr);

    gap: 60px;

    align-items: start;
}


/* GALLERY */

.detail-gallery {
    position: relative;
}

.main-product-image {
    width: 100%;

    aspect-ratio: 1 / 1.15;

    object-fit: contain;

    background: #0b0d10;

    border-radius: 20px;

    border: 1px solid var(--border);

    cursor: zoom-in;
}

.thumbnails {
    display: flex;

    gap: 10px;

    overflow-x: auto;

    margin-top: 15px;

    padding-bottom: 5px;
}

.thumbnail {
    flex: 0 0 80px;

    width: 80px;
    height: 80px;

    object-fit: cover;

    border-radius: 10px;

    border: 1px solid var(--border);

    cursor: pointer;

    opacity: .55;

    transition: .25s;
}

.thumbnail.active,
.thumbnail:hover {
    opacity: 1;

    border-color:
        rgba(255,255,255,.6);
}


/* INFO */

.detail-info {
    padding-top: 15px;
}

.detail-brand {
    color: var(--silver-dark);

    font-size: .7rem;

    font-weight: 800;

    letter-spacing: 3px;

    text-transform: uppercase;
}

.detail-title {
    margin-top: 12px;

    font-family: var(--title);

    font-size: clamp(
        2rem,
        4vw,
        3.2rem
    );

    line-height: 1.15;

    letter-spacing: 2px;

    text-transform: uppercase;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #a5abb5
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.detail-price {
    margin-top: 20px;

    font-size: 1.5rem;

    font-weight: 800;
}

.detail-description {
    margin-top: 25px;

    color: #9298a2;

    line-height: 1.8;

    font-size: .88rem;
}


/* SIZES */

.size-title {
    margin-top: 35px;

    font-size: .72rem;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.sizes {
    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 15px;
}

.size-btn {
    min-width: 55px;

    padding: 12px 16px;

    border-radius: 8px;

    border: 1px solid var(--border);

    background: #0d0f13;

    color: #dce0e5;

    cursor: pointer;

    font-size: .75rem;

    font-weight: 700;

    transition: .25s;
}

.size-btn:hover,
.size-btn.selected {
    color: #000;

    background: white;

    border-color: white;
}


/* WHATSAPP */

.order-btn {
    width: 100%;

    margin-top: 30px;

    padding: 17px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 10px;

    border-radius: 50px;

    background: white;

    color: black;

    cursor: pointer;

    text-decoration: none;

    font-size: .75rem;

    font-weight: 900;

    letter-spacing: 2px;

    text-transform: uppercase;

    transition: .3s;
}

.order-btn:hover {
    background: #dfe3e8;

    transform: translateY(-2px);

    box-shadow:
        0 10px 30px rgba(255,255,255,.15);
}


/* =========================
   EMPTY / LOADING
========================= */

.loading {
    min-height: 300px;

    display: flex;

    justify-content: center;

    align-items: center;

    color: var(--muted);

    letter-spacing: 2px;

    font-size: .75rem;

    text-transform: uppercase;
}

.empty {
    grid-column: 1 / -1;

    padding: 80px 20px;

    text-align: center;

    color: var(--muted);
}


/* =========================
   MODAL
========================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 3000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.94);
}

.modal.active {
    display: flex;
}

.modal img {
    max-width: 95vw;
    max-height: 90vh;

    object-fit: contain;

    border-radius: 10px;
}

.modal-close {
    position: absolute;

    top: 20px;
    right: 25px;

    color: white;

    background: none;

    font-size: 35px;

    cursor: pointer;
}


/* =========================
   FOOTER
========================= */

footer {
    padding: 55px 20px;

    text-align: center;

    color: #676d77;

    font-size: .72rem;

    letter-spacing: 1px;

    background: #020304;

    border-top: 1px solid var(--border);
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px) {

    header {
        padding: 0 18px;
    }

    .main-nav {
        display: none;
    }

    .hero {
        padding:
            76px 0 40px;
    }

    .hero-video-wrapper {
        border-radius: 0;

        border-left: 0;
        border-right: 0;
    }

    .hero-content {
        bottom: 8%;
    }

    .hero-title {
        letter-spacing: 5px;
    }

    .detail-layout {
        grid-template-columns: 1fr;

        gap: 35px;
    }

    .detail-info {
        padding: 0 5px;
    }

}


@media(max-width:600px) {

    .brand-name {
        font-size: 1.05rem;
    }

    .header-wa {
        width: 38px;
        height: 38px;
    }

    .hero-video-wrapper {
        width: 100%;
        aspect-ratio: 16 / 9;
    }

    .hero-symbol {
        width: 38px;
        height: 38px;
    }

    .hero-title {
        font-size: 2.2rem;
    }

    .hero-subtitle {
        font-size: .6rem;
        letter-spacing: 2px;
    }

    .category-grid {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }

    .category-card {
        min-height: 165px;
    }

    .category-logo {
        width: 65px;
        height: 65px;
    }

    .products-grid {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }

    .product-card {
        min-height: 330px;
    }

    .product-image {
        height: 250px;
    }

    .product-info {
        left: 13px;
        right: 13px;
        bottom: 13px;
    }

    .product-name {
        font-size: .75rem;
    }

    .product-price {
        font-size: .9rem;
    }

    .product-view {
        font-size: .55rem;
        padding: 7px 11px;
    }

    .page-header {
        padding:
            110px 20px 40px;
    }

    .products-page {
        padding:
            0 15px 80px;
    }

}

</style>
</head>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const GITHUB_USER = "bhastian-ec";

const GITHUB_REPO = "sky";

const GITHUB_BRANCH = "main";

const PRODUCTS_FOLDER = "products";

const WHATSAPP = "593995023674";


/* =====================================================
   VARIABLES
===================================================== */

let catalog = [];

let selectedSize = "";


/* =====================================================
   GITHUB API
===================================================== */

async function githubAPI(path) {

    const url =
        `https://api.github.com/repos/` +
        `${GITHUB_USER}/${GITHUB_REPO}/contents/` +
        `${path}?ref=${GITHUB_BRANCH}`;

    const response = await fetch(url);

    if (!response.ok) {

        throw new Error(
            `GitHub API error: ${response.status}`
        );

    }

    return await response.json();
}


/* =====================================================
   LIMPIAR NOMBRE
===================================================== */

function cleanText(text) {

    return text
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g, " ")
        .trim();

}


/* =====================================================
   ANALIZAR NOMBRE DEL ARCHIVO
=====================================================

   Ejemplos:

   FERRARI-35-1.jpg
   FERRARI-35-2.jpg
   FERRARI-35-3.jpg

   Resultado:

   producto = FERRARI
   precio = 35
   foto = 1,2,3

===================================================== */

function parseProductFile(filename) {

    const extension =
        filename.match(/\.[^/.]+$/)?.[0] || "";

    const withoutExtension =
        filename.replace(/\.[^/.]+$/, "");

    const parts =
        withoutExtension.split("-");


    let productName =
        cleanText(parts[0] || "Producto");

    let price = "0";

    let photoNumber = 1;


    if (parts.length >= 2) {

        price =
            parts[1].replace(",", ".").trim();

    }


    if (parts.length >= 3) {

        const number =
            parseInt(parts[2], 10);

        if (!isNaN(number)) {

            photoNumber = number;

        }

    }


    return {

        productName,
        price,
        photoNumber,
        extension

    };

}


/* =====================================================
   CARGAR CATÁLOGO
===================================================== */

async function loadCatalog() {

    try {

        const folders =
            await githubAPI(PRODUCTS_FOLDER);


        if (!Array.isArray(folders)) {

            throw new Error(
                "La carpeta products no existe."
            );

        }


        const result = [];


        for (const folder of folders) {

            if (folder.type !== "dir") {
                continue;
            }


            const category =
                folder.name;


            let files = [];


            try {

                files =
                    await githubAPI(
                        `${PRODUCTS_FOLDER}/${category}`
                    );

            } catch (error) {

                console.error(
                    "Error categoría:",
                    category,
                    error
                );

                continue;

            }


            if (!Array.isArray(files)) {
                continue;
            }


            /* -----------------------------------------
               BUSCAR LOGO
            ----------------------------------------- */

            let categoryLogo = null;


            const possibleLogoNames = [

                `${category}.png`,
                `${category}.jpg`,
                `${category}.jpeg`,
                `${category}.webp`,
                `${category}.svg`

            ];


            const logoFile =
                files.find(file =>
                    possibleLogoNames.some(
                        name =>
                            name.toLowerCase() ===
                            file.name.toLowerCase()
                    )
                );


            if (logoFile) {

                categoryLogo =
                    logoFile.download_url;

            }


            /* -----------------------------------------
               PRODUCTOS
            ----------------------------------------- */

            const productsMap = {};


            for (const file of files) {

                if (file.type !== "file") {
                    continue;
                }


                if (
                    !/\.(jpg|jpeg|png|webp|avif)$/i
                    .test(file.name)
                ) {
                    continue;
                }


                /* No considerar el logo como producto */

                if (
                    file.name.toLowerCase() ===
                    `${category.toLowerCase()}.png`
                    ||
                    file.name.toLowerCase() ===
                    `${category.toLowerCase()}.jpg`
                    ||
                    file.name.toLowerCase() ===
                    `${category.toLowerCase()}.jpeg`
                    ||
                    file.name.toLowerCase() ===
                    `${category.toLowerCase()}.webp`
                ) {

                    continue;

                }


                const parsed =
                    parseProductFile(file.name);


                /*
                   La combinación producto + precio
                   identifica el producto.

                   Ejemplo:

                   FERRARI-35-1
                   FERRARI-35-2

                   = mismo producto
                */

                const key =
                    `${parsed.productName}__${parsed.price}`;


                if (!productsMap[key]) {

                    productsMap[key] = {

                        id:
                            createId(
                                category +
                                "_" +
                                parsed.productName +
                                "_" +
                                parsed.price
                            ),

                        category,

                        name:
                            parsed.productName,

                        price:
                            parsed.price,

                        images: []

                    };

                }


                productsMap[key]
                    .images
                    .push({

                        url:
                            file.download_url,

                        order:
                            parsed.photoNumber,

                        filename:
                            file.name

                    });

            }


            const products =
                Object.values(productsMap);


            products.forEach(product => {

                product.images.sort(
                    (a,b) =>
                        a.order - b.order
                );

                product.images =
                    product.images.map(
                        img => img.url
                    );

            });


            result.push({

                name: category,

                logo: categoryLogo,

                products

            });

        }


        catalog = result;


        console.log(
            "Catálogo cargado:",
            catalog
        );


        router();


    } catch (error) {

        console.error(
            "Error cargando catálogo:",
            error
        );


        document.getElementById("app").innerHTML = `

            <div class="loading">

                No se pudo cargar el catálogo.

                <br><br>

                Revisa que la carpeta
                <strong>products</strong>
                exista en GitHub.

            </div>

        `;

    }

}

/* =====================================================
   ROUTER
===================================================== */

function router() {

    const parts =
        getHashParts();


    const route =
        parts[0] || "";


    if (
        !route ||
        route === "/"
    ) {

        renderHome();

        return;

    }


    if (
        route === "colecciones"
    ) {

        renderCollections();

        return;

    }


    if (
        route === "categoria"
    ) {

        const category =
            decodeURIComponent(
                parts[1] || ""
            );

        renderCategory(category);

        return;

    }


    if (
        route === "producto"
    ) {

        const category =
            decodeURIComponent(
                parts[1] || ""
            );

        const product =
            decodeURIComponent(
                parts[2] || ""
            );

        renderProduct(
            category,
            product
        );

        return;

    }


    if (
        route === "nosotros"
    ) {

        renderAbout();

        return;

    }


    if (
        route === "contacto"
    ) {

        renderContact();

        return;

    }


    renderHome();

}


/* =====================================================
   HASH
===================================================== */

function getHashParts() {

    let hash =
        window.location.hash
            .replace(/^#/, "")
            .replace(/^\/+/, "");


    if (!hash) {

        return ["/"];

    }


    return hash
        .split("/")
        .filter(Boolean);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   ESCAPE ATRIBUTO
===================================================== */

function escapeAttr(value) {

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}
